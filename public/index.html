<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Enviar Avaliação NPS</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Enviar Mensagem NPS por WhatsApp</h1>
  <form action="/enviar" method="POST">
    <input type="text" name="numero" placeholder="Digite o número com DDD" required><br><br>
    <button type="submit">Enviar Avaliação</button>
  </form>
</body>
</html>
